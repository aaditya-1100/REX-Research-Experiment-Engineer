[project]
name = "rex-research"
version = "0.1.0"
description = "REX — Research Experiment Engineer: Autonomous computational research with machine-readable provenance and independent verification"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "REX Core Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "click>=8.1.7",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "docker>=7.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "psutil>=5.9.8",
    "rich>=13.7.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
]

[project.scripts]
rex = "rex.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rex"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "docker: marks tests that require Docker daemon",
    "integration: marks integration tests",
    "unit: marks unit tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["testsprite_tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

